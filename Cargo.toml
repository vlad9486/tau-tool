[package]
name = "tau-tool"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "tau"
path = "src/main.rs"

[dependencies]
object = { version = "0.40.0", default-features = false, features = ["read", "build"] }
clap = { version = "4.6", features = ["derive"] }
thiserror = { version = "2.0" }
crc = { version = "3.4" }
gpt = { version = "4.1" }
sudo = { version = "0.6.0" }
uuid = { version = "1.26" }
anyhow = { version = "1.0" }
serde_json = { version = "1.0" }
serde = { version = "1.0", features = ["derive"] }
toml = { version = "1.1.6" }
tempfile = { version = "3.27" }
